name: Nourish
description: 'Nourish is a virtual nutrition-counseling telehealth platform that connects
  patients with Registered Dietitian Nutritionists (RDNs) through insurance-covered
  video appointments in all 50 states. Its network of more than 10,000 dietitians
  supports conditions including diabetes, eating disorders, heart health, and gut
  health, and a companion mobile app handles meal and goal tracking, secure messaging,
  lab-work review, and between-session support. Nourish verifies insurance and submits
  claims on the patient''s behalf, with the company reporting that 94% of patients
  pay $0 out of pocket. Backed by Index Ventures, Menlo Ventures, and Susa Ventures,
  the company raised a $100M Series C. Nourish exposes a consumer marketing and
  patient-app surface only; no public developer API, SDKs, or API documentation are
  published at this time.'
